name: flutter_molh
description: "مساعد الطالب العراقي"
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  record: ^6.1.2
  just_audio: ^0.10.4
  path_provider: ^2.1.5
  flutter_tts: ^4.2.3
  google_mlkit_digital_ink_recognition: ^0.16.1
  http: ^1.2.2
  file_picker: ^13.1.0
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  syncfusion_flutter_pdfviewer: ^35.1.37
  image_picker: ^1.2.3
  printing: ^5.15.1
  url_launcher: ^6.3.3
  alarm: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/books/grade1/
    - assets/books/grade2/
    - assets/books/grade3/
    - assets/books/grade4/
    - assets/books/grade5/
    - assets/books/grade6/
    - assets/books/middle1/
    - assets/books/middle2/
    - assets/books/middle3/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "new_icon.png"
  min_sdk_android: 21